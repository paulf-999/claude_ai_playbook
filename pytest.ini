[pytest]
testpaths = src/claude/_tests
pythonpath = .
# test_claude_usage_report.py tests a claude_usage_report tool that no longer
# exists anywhere in the repo or a live config; ignored until it's restored or
# the test is deleted (needs an explicit decision, not a mechanical fix).
addopts = --cov=src/claude/_tests --cov-report=term-missing --tb=no -rN -q
    --ignore=src/claude/_tests/skills/test_claude_usage_report.py
