---
# Skill Domain Configuration
#
# Defines valid skill domain prefixes and their metadata.
# Used by skill naming validation and Claude review tool.
#
# To add a new domain:
# 1. Add entry below with id, prefix, directory, description
# 2. Set directory to the skills/ folder it lives in — domains may share one
#    (e.g. confluence and jira both live in _atlassian_skills)
# 3. Create that folder under skills/ if it doesn't exist yet
#
# Active domains (match existing skills): confluence, jira, claude, git

domains:
    - id: confluence
      prefix: confluence_
      directory: _atlassian_skills
      description: Confluence page creation and management
      stable: false

    - id: jira
      prefix: jira_
      directory: _atlassian_skills
      description: Jira issue and epic creation
      stable: false

    - id: claude
      prefix: claude_
      directory: _claude_skills
      description: Claude optimization tools (config review, Graphify setup, audits)
      stable: false

    - id: git
      prefix: git_
      directory: _git_skills
      description: Git and GitHub workflow automation (branches, commits, pull requests)
      stable: false
