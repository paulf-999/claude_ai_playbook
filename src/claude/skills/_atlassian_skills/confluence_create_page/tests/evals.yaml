---
_metadata:
    date_created: '2026-06-07'
    date_updated: '2026-10-27'
    status: active

skill_name: confluence_create_page

evals:
  # Phase 1 — gather details / happy path
    - name: happy_path_general_page
      description: Full flow — gather details, local draft review, publish only after approval
      input:
          prompt: create a confluence page about our Q3 roadmap
      setup: {}
      expected_output: >
          Claude gathers page details for the general_page pattern, writes a local
          draft to ~/_drafts/confluence/, asks for review, iterates on feedback,
          then publishes to Confluence only after the user explicitly approves
          the draft.
      assertions:
          - Claude reads reference/_phases.md and follows reference/patterns/_general_page.md (Phase 2)
          - Claude writes a draft to ~/_drafts/confluence/ before creating anything in Confluence
          - Draft filename uses lowercase with underscores (no spaces, no hyphens)
          - Claude asks the user to review the draft and requests approval before publishing
          - Claude does not call createConfluencePage until the user explicitly approves the draft

    - name: happy_path_platform_risk_assessment
      description: Platform risk pattern — gather theme descriptions, rate L/M/H, draft review, publish after approval
      input:
          prompt: create a platform risk assessment page for Airbyte
      setup: {}
      expected_output: >
          Claude follows reference/patterns/_platform_risk_assessment.md for
          Phase 2, gathers the tool, space, parent page and a description for
          every Build, Run and Govern theme, proposes L/M/H ratings and an
          executive summary for confirmation, writes a local draft, and
          publishes only after approval.
      assertions:
          - Claude reads reference/patterns/_platform_risk_assessment.md for Phase 2
          - Claude asks for the target space and parent page rather than defaulting to one
          - Claude presents L/M/H ratings per theme and flags uncertain ones before writing the draft
          - Claude writes a draft to ~/_drafts/confluence/ before creating anything in Confluence
          - The page title follows 'Platform Risk & Maturity Assessment: <tool name>'
          - Claude does not call createConfluencePage until the user explicitly approves the draft

    - name: mcp_unavailable
      description: Atlassian MCP not connected — skill stops before pattern selection
      input:
          prompt: /confluence_create_page
      setup:
          mcp_available: false
      expected_output: >
          Claude verifies the Atlassian MCP is available, then presents the
          pattern selection prompt. If the MCP is unavailable, Claude stops and
          tells the user to enable it.
      assertions:
          - Claude calls getAccessibleAtlassianResources before proceeding to Phase 1
          - Claude stops and tells the user to run 'make enable_mcp server=Atlassian' if the MCP is unavailable
          - Claude does not proceed to pattern selection without a successful MCP connection

  # Confirmations the pattern phase must make
    - name: space_not_named_is_confirmed
      description: User doesn't name a space — Claude asks instead of inferring one
      input:
          prompt: create a general confluence page called Data Platform Q4 Roadmap
      setup: {}
      expected_output: >
          Claude asks which Confluence space to use, per _phases.md's "Do NOT infer
          the target Confluence space", before writing any draft.
      assertions:
          - Claude asks the user for the target space
          - Claude does not pick a space from earlier context or a default
          - Claude does not call createConfluencePage before the space is confirmed

    - name: parent_page_required
      description: User asks to publish at the space root — Claude asks for a parent page
      input:
          prompt: put the Q4 roadmap page at the top of the DOCS space
      setup: {}
      expected_output: >
          Claude explains pages are never published at the space root and asks the
          user to confirm a parent page.
      assertions:
          - Claude refuses to publish at the space root
          - Claude asks the user to confirm a parent page
          - Claude does not call createConfluencePage without a confirmed parent

    - name: unsupported_pattern_offers_valid_ones
      description: User asks for a pattern the skill doesn't support (a not_for case)
      input:
          prompt: create a confluence requirements page for the new ingestion service
      setup: {}
      expected_output: >
          Claude says the requirements pattern isn't supported and offers the two
          patterns from _phases.md, general_page and platform_risk_assessment.
      assertions:
          - Claude says the requested pattern isn't supported
          - Claude lists general_page and platform_risk_assessment as the options
          - Claude does not invent a new page structure for the unsupported pattern

    - name: personal_names_replaced_with_roles
      description: User content names an individual — Claude uses a role instead
      input:
          prompt: add a section saying Jane Smith owns the migration
      setup: {}
      expected_output: >
          Claude writes the section with a generic role, such as "the migration
          owner", per _phases.md's rule against naming individuals.
      assertions:
          - The draft does not contain the individual's name
          - Claude uses a role descriptor in place of the name
          - Claude tells the user it replaced the name with a role

  # Draft review and publish
    - name: draft_review_iteration
      description: User requests changes to the local draft before approving publish
      input:
          prompt: create a confluence page about our Q3 roadmap
          review_response: change the Overview section, then show me again
      setup: {}
      expected_output: >
          Claude rewrites the draft file in place, asks for review again, and
          repeats until the user explicitly approves — createConfluencePage is
          never called during iteration.
      assertions:
          - Claude applies the requested change and rewrites the same draft file (not a new one)
          - Claude re-presents the draft path and asks for approval again after each revision
          - Claude does not call createConfluencePage or updateConfluencePage during any iteration
          - Iteration continues until an explicit approval is given, not a fixed number of rounds

    - name: publish_permission_denied
      description: createConfluencePage fails because the user lacks write access to the space
      input:
          prompt: create a general page called Data Platform Q4 Roadmap in DOCS
          review_response: approved, publish it
      setup:
          mcp_tool_call: createConfluencePage returns a permission error
      expected_output: >
          Claude reports that publishing failed because of space permissions, points
          to reference/_error_recovery.md's "Can't access the Confluence space"
          section, and keeps the local draft.
      assertions:
          - Claude names the space it couldn't publish to
          - Claude points the user to reference/_error_recovery.md
          - Claude does not claim the page was created
          - Claude does not delete the local draft file

  # Not for
    - name: page_update_request_out_of_scope
      description: User asks to edit an existing page, which the skill does not do
      input:
          prompt: /confluence_create_page update the Q3 roadmap page with the new dates
      setup: {}
      expected_output: >
          Claude explains the skill only creates new pages and can't edit an
          existing one, and calls no Confluence tool.
      assertions:
          - Claude says updating existing pages is out of scope for this skill
          - Claude does not call updateConfluencePage
          - Claude does not create a new duplicate page instead
