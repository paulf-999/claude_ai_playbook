---
name: capture_session_prompts_evals
description: 6 evaluation scenarios for capture_session_prompts (v0.1.0 - Draft)

evals:
  # Capture phase
  - name: capture_default_date
    description: Capture prompts for today (default date)
    input: "/capture_session_prompts"
    setup: ~/.claude/history.jsonl populated with today's prompts (at least 2 entries)
    expected_output:
      - Script runs without errors
      - Output file created at ~/.claude/sessions/YYYY-MM-DD_prompts.md (today's date)
      - Markdown table with headers: Timestamp, Theme, Subject, Status, Proposed Action, Closure, MoSCoW, Prompt
      - Summary statistics included

  - name: capture_specific_date
    description: Capture prompts for a specific past date
    input: "/capture_session_prompts --date 2026-08-20"
    setup: history.jsonl contains entries from 2026-08-20
    expected_output:
      - Script runs without errors
      - Output file created at ~/.claude/sessions/2026-08-20_prompts.md
      - Only prompts from target date included
      - Timestamp range matches target date

  # Categorization phase
  - name: categorization_themes
    description: Theme categorization heuristics work correctly
    input: Review captured markdown table for theme column accuracy
    setup: Multiple prompts with varied content (rules, skills, processes, planning, todos)
    expected_output:
      - Themes correctly categorized: Rules, Skills, Process, Planning, TODOs, Other, Unclassified
      - <10% misclassification rate acceptable for Draft
      - Theme counts reflect actual distribution

  - name: categorization_status
    description: Status detection (Done, Pending, Question, Response, Note)
    input: Captured prompts with various status indicators
    setup: Prompts contain status markers ("done", "pending", "?", "response", "noted")
    expected_output:
      - Statuses correctly detected: ✅ Done, ⏳ Pending, ✔️ Clarifying Question, ↩️ Response, 📋 Note
      - Marker-based detection accurate
      - Summary statistics by status correct

  # Output & format phase
  - name: markdown_table_format
    description: Output markdown table is well-formed and complete
    input: Generated markdown file from capture
    setup: Capture complete; output file exists
    expected_output:
      - Markdown table valid and parseable
      - All columns present and filled (empty cells noted)
      - Prompt text preserved in full
      - No corrupted or truncated rows
      - Summary section readable and accurate

  # Integration phase
  - name: manual_refinement_workflow
    description: Refined markdown can be edited and used for planning
    input: Capture prompts, review, manually refine table, use for TODOs
    setup: Captured markdown file ready for editing
    expected_output:
      - File is editable (plain markdown)
      - Rows can be updated without parsing errors
      - Refined file can be re-read for planning
      - High-priority pending items easily identifiable (Pending + Must/Should)
      - Integration with TODO planning workflow is straightforward
