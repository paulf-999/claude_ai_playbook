---
name: claude_setup_graphify
version: 1.2.1
summary: Set up Graphify on a repo to generate a local AST-based knowledge graph, reducing token cost for codebase exploration.
maturity: tactical
test_coverage_level: comprehensive

dispatch:
    triggers:
        explicit:
            - /claude_setup_graphify
            - set up graphify
            - setup graphify
            - enable graphify
        contextual:
            - user wants to set up Graphify on a repo
            - user wants to reduce token usage for codebase exploration

    not_for:
        - querying an existing graph — use /graphify for that

output:
    type: conversational
    confirmation_required: false
    reversible: true
    artifacts: []

waives_response_standards: true
# Multi-phase setup workflow (validate → configure → build → verify) requires free-form prompts
# incompatible with response standards Summary + Next steps format

dependencies:
    tools:
        - Bash
        - Read
        - Edit
    mcp_servers: []
    external:
        - graphifyy 0.8.36 (pip install "graphifyy==0.8.36")
