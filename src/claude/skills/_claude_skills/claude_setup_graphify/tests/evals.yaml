---
name: claude_setup_graphify_evals
description: 12 evaluation scenarios for claude_setup_graphify

evals:
  # Pre-flight validation (linear checks)

    - name: validate_git_repo
      description: confirm a git repository, and fail gracefully outside one
      input: /claude_setup_graphify (once in a git repo, once in a plain directory)
      setup: one directory with .git, one without
      expected_output: [git repo confirmed and setup continues, outside a repo a clear "not in git repo" error and nothing installed]

    - name: validate_python_version
      description: confirm Python 3.8+, and fail gracefully on an older version
      input: /claude_setup_graphify (once with Python 3.8+, once with 3.6 or 3.7)
      setup: two interpreters
      expected_output: [3.8+ confirmed and setup continues, on 3.6/3.7 a clear "Python 3.8+ required" error and nothing installed]

    - name: validate_writable_directory
      description: confirm the target directory is writable, and fail gracefully when it is read-only
      input: /claude_setup_graphify (once writable, once read-only)
      setup: graphify-out/ writable, then read-only
      expected_output: [write permission confirmed, when read-only a clear "directory not writable" error and nothing extracted]

  # Happy path: Installation (after validation passes)
    - name: install_graphify
      description: pinned pip install graphifyy==0.8.36, then graphify install --platform claude
      input: /claude_setup_graphify
      setup: all validations pass, internet
      expected_output: [pinned version installed, import graphify succeeds, /graphify skill callable]

  # Happy path: Extraction to verification
    - name: extract_knowledge_graph
      description: graphify extract . generates graph.json after the user confirms what leaves the machine
      input: graphify extract .
      setup: graphifyy installed, repo with code and docs, an LLM API key set
      expected_output: [data-leaving warning shown, user confirmation before extraction, graph created]

    - name: add_gitignore_entry
      description: append graphify-out/ to .gitignore
      input: add .gitignore entry
      setup: graphify-out/ exists
      expected_output: [.gitignore updated]

    - name: update_claude_md
      description: CLAUDE.md updated with Graphify section
      input: edit CLAUDE.md
      setup: CLAUDE.md exists
      expected_output: [section added]

    - name: verify_graphify_skill_callable
      description: /graphify queries graph successfully
      input: structural question
      setup: all phases complete
      expected_output: [results returned, no file reads]

  # Critical errors (after validation passes)
    - name: error_install_fails
      description: handle pip/graphify install failure
      input: /claude_setup_graphify
      setup: validations pass, internet disabled
      expected_output: [install fails, clear error, retry suggested]

    - name: error_extraction_fails
      description: handle graphify extract failure
      input: graphify extract
      setup: validations pass, no code files
      expected_output: [extraction fails, error reported, retry suggested]

    - name: error_skill_not_callable
      description: /graphify verification fails
      input: test query to /graphify
      setup: all phases done, skill error
      expected_output: [error detected, manual verify suggested]

  # Not for
    - name: query_existing_graph_out_of_scope
      description: user asks a question of an existing graph, which belongs to /graphify (a not_for case)
      input: /claude_setup_graphify which files call the auth module?
      setup: graphify-out/graph.json already exists
      expected_output: [points the user to /graphify for the question, does not reinstall or re-extract]
