name: git_request_changes_pr
version: 0.3.1

dispatch:
  triggers:
    explicit:
      - /git_request_changes_pr
      - "post request changes"
      - "request changes on this PR"
    contextual:
      - user wants to formally block a PR merge with inline file-level comments
      - user has identified blocking issues and wants to post a CHANGES_REQUESTED review

  not_for:
    - /git_review_pr handles general scorecard review without a formal GitHub review event
    - approving a PR or commenting without blocking merge

output:
  type: external_service
  confirmation_required: true
  reversible: false
  side_effects:
    - posts CHANGES_REQUESTED review to GitHub PR with inline file comments
    - optionally dismisses an existing CHANGES_REQUESTED review before posting
  required_sections:
    - pr_url
  optional_sections:
    - generated_by_attribution

dependencies:
  tools:
    - Bash
    - Agent
  subagents:
    - code_reviewer
  external:
    - GitHub repository with write access
    - gh CLI authenticated
