name: git_review_pr
version: 0.2.0

dispatch:
  triggers:
    explicit:
      - /git_review_pr
      - /git_review_pr <number>
    contextual:
      - user asks to review a PR or post a Claude review
      - auto-triggered at end of /git_create_pr when user opts in

  not_for:
    - creating a PR — use /git_create_pr instead
    - general code review not tied to a GitHub PR

output:
  type: mixed
  confirmation_required: true
  reversible: false
  artifacts: []
  side_effects:
    - posts comment to GitHub pull request
  required_sections:
    - review_comment
    - pr_url
  optional_sections: []

dependencies:
  tools:
    - Bash
    - Agent
  mcp_servers: []
  external:
    - GitHub repository with read access
    - gh CLI authenticated to GitHub
