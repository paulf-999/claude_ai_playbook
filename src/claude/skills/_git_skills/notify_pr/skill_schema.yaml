---
name: notify_pr
version: 1.1.0

dispatch:
    triggers:
        explicit:
            - /notify_pr
            - /notify_pr <number>
        contextual:
            - auto-triggered at end of /create_pr when user opts in

    not_for:
        - creating a PR — use /create_pr instead
        - posting a GitHub review comment — use /review_pr instead

output:
    type: external_service
    confirmation_required: true
    reversible: false
    artifacts: []
    side_effects:
        - sends Teams channel notification
    required_sections: []
    optional_sections: []

dependencies:
    tools:
        - Bash
        - Read
        - Write
    mcp_servers:
        - Microsoft_365
    external:
        - Teams incoming webhook URL (configured in teams_config.json)
        - teams_config.json present in project memory directory
