---
name: review_pr
version: 0.1.9

dispatch:
    triggers:
        explicit:
            - /review_pr
            - /review_pr <number>
        contextual:
            - user asks to review a PR or post a Claude review
            - auto-triggered at end of /create_pr when user opts in

    not_for:
        - creating a PR — use /create_pr instead
        - general code review not tied to a GitHub PR

output:
    type: mixed
    confirmation_required: true
    reversible: false
    artifacts: []
    side_effects:
        - posts comment to GitHub pull request
    required_sections:
        - review_comment
        - pr_url
    optional_sections: []

dependencies:
    tools:
        - Bash
        - Agent
    mcp_servers: []
    external:
        - GitHub repository with read access
        - gh CLI authenticated to GitHub
