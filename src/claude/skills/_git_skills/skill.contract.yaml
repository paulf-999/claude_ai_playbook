---
name: git_create_pr
version: 1.0.0
summary: Create GitHub PR from staged changes
maturity: tactical
test_coverage_level: comprehensive

dispatch:
  triggers:
    explicit:
      - /git_create_pr
      - create a pr
      - create a PR
      - make a pr
      - make a PR
      - open a pr
      - open a PR
      - submit a pr
      - submit a PR
      - push a pr
      - push a PR
      - create a mr
      - create a MR
      - make a mr
      - make a MR
      - open a mr
      - open a MR
      - submit a mr
      - submit a MR
      - push a mr
      - push a MR
  not_for:
    - complex merge conflict scenarios
    - non-main branch PRs

output:
  type: conversational
  confirmation_required: true
  reversible: false
  returns:
    - GitHub PR URL
    - PR number
    - PR title, body, labels

waives_response_standards: true
# Interactive workflow with multiple confirmation points requires free-form prompts
# incompatible with response standards Summary + Next steps format

requires:
  tools:
    - Bash
    - gh CLI (authenticated)
  resources:
    - .github/pull_request_template.md
    - git repo with origin remote
    - <20 staged files

dependencies:
  external:
    - git
    - gh
  permissions:
    - write access to repo
    - GitHub token (gh auth)
