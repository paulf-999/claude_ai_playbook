name: ansible_playbook_creation
version: 0.1.0

dispatch:
  triggers:
    explicit:
      - /ansible_playbook_creation
      - /new_ansible_role
    contextual:
      - user is developing or extending an Ansible role or playbook in pyrc-cac-ans
      - user asks how to structure or approach Ansible work in pyrc-cac-ans
      - user asks to automate deployment of a new application via Ansible

  not_for:
    - VM provisioning (Terraform) — use /provision_vm instead
    - general Ansible debugging — use the debugger sub-agent instead

output:
  type: mixed
  confirmation_required: true
  reversible: true
  artifacts:
    - Ansible role files (defaults/main.yml, tasks/main.yml, README.md)
    - playbook YAML
    - group_vars YAML
  side_effects:
    - writes files to pyrc-cac-ans repo
    - raises a GitHub PR via /git_create_pr
  required_sections:
    - pre_check_answers
    - design_proposal
  optional_sections:
    - group_vars

dependencies:
  tools:
    - Bash
    - Read
    - Edit
    - Write
    - Glob
    - Grep
  mcp_servers: []
  external:
    - pyrc-cac-ans repo cloned at ~/git_repos/infrastructure/eng/pyrc-cac-ans
    - ansible-lint installed
    - yamllint installed
